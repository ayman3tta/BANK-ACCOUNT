<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="تطبيق حساب البيت - متابعة أموالك بسهولة">
<title>حساب البيت</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ── Tokens ── */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --surface2: #f8fafc;
  --surface3: #eef2f6;
  --border: #e2e8f0;
  --ink: #0f172a;
  --ink-sub: #475569;
  --muted: #64748b;
  --acc: #4f46e5;
  --acc-light: #eef2ff;
  --acc2: #6366f1;
  --pos: #059669;
  --pos-light: #ecfdf5;
  --neg: #dc2626;
  --neg-light: #fef2f2;
  --warn: #d97706;
  --gold: #b45309;
  --r: 20px;
  --r-sm: 12px;
  --nav-h: 72px;
  --hdr-h: 60px;
}
.f-icon {
  display: inline-block;
  vertical-align: middle;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}
.nav-btn .f-icon {
  width: 22px;
  height: 22px;
  margin-bottom: 3px;
  stroke-width: 1.8;
  transition: transform .15s ease, stroke .15s ease;
}
.nav-btn.on .f-icon {
  stroke: var(--acc);
  transform: translateY(-1px);
}
.nav-btn:not(.on) .f-icon {
  stroke: var(--muted);
}
.btn .f-icon {
  margin-left: 5px;
}
.lr-btn .f-icon {
  width: 13px;
  height: 13px;
  stroke-width: 2;
}
.fab .f-icon {
  stroke: #ffffff;
  stroke-width: 2.4;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 15px/1.6 'Cairo', -apple-system, sans-serif;
  min-height: 100dvh; display: flex; justify-content: center;
  overscroll-behavior: none;
}
#shell {
  width: 100%; max-width: 430px; min-height: 100dvh;
  display: flex; flex-direction: column; background: var(--bg); position: relative;
}
#hdr {
  position: sticky; top: 0; z-index: 50; height: var(--hdr-h);
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.hdr-title { font-size: 18px; font-weight: 900; letter-spacing: -.3px; }
.hdr-sub { font-size: 11px; color: var(--muted); font-weight: 600; }
.hdr-actions { display: flex; gap: 6px; align-items: center; }
.hdr-btn {
  width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface2); color: var(--ink); font-size: 16px;
  display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .15s;
}
.hdr-btn:active { transform: scale(.9); background: var(--acc); color: #fff; border-color: var(--acc); }
.sync-pill {
  display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700;
  padding: 4px 10px; border-radius: 20px; border: 1.5px solid var(--border);
  background: var(--surface2); color: var(--muted); cursor: pointer; white-space: nowrap;
}
.sync-pill.ok { background: #d1fae5; border-color: #6ee7b7; color: #059669; }
.sync-pill.going { background: #ede9fe; border-color: #c4b5fd; color: var(--acc); }
.sync-pill.err { background: #fee2e2; border-color: #fca5a5; color: var(--neg); }
[data-theme=dark] .sync-pill.ok { background: #064e3b; border-color: #065f46; color: #34d399; }
[data-theme=dark] .sync-pill.going { background: #2d1b69; border-color: #4c1d95; color: var(--acc2); }
[data-theme=dark] .sync-pill.err { background: #450a0a; border-color: #7f1d1d; color: var(--neg); }
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.sync-dot.pulse { animation: blink 1s ease infinite alternate; }
@keyframes blink { from { opacity:.3; transform: scale(.7); } to { opacity:1; transform: scale(1.2); } }
#app {
  flex: 1; padding: 16px 16px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);
  overflow-y: auto;
}
#nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 430px; z-index: 100; background: var(--surface);
  border-top: 1px solid var(--border);
  height: calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
  padding-bottom: env(safe-area-inset-bottom,0px);
  display: flex; align-items: stretch;
  box-shadow: 0 -8px 30px rgba(0,0,0,.08);
}
.nav-btn {
  flex: 1; border: none; background: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; color: var(--muted); cursor: pointer; transition: color .15s;
  padding: 8px 4px 4px; position: relative;
}
.nav-btn.on { color: var(--acc); }
.nav-btn .ni { font-size: 22px; line-height: 1; transition: transform .2s cubic-bezier(.34,1.56,.64,1); }
.nav-btn.on .ni { transform: scale(1.12) translateY(-1px); }
.nav-btn .nl { font-size: 10px; font-weight: 700; white-space: nowrap; }
.nav-btn.on::after {
  content: ''; position: absolute; top: 0; left: 20%; right: 20%;
  height: 3px; border-radius: 0 0 4px 4px; background: var(--acc);
}
.nav-btn:active { opacity: .7; }
#fab {
  position: fixed; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);
  right: calc(50% - 215px + 16px);
  width: 54px; height: 54px; border-radius: 50%;
  background: linear-gradient(135deg, var(--acc), var(--acc2));
  color: #fff; font-size: 26px; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 25px rgba(108,99,255,.4); border: none; cursor: pointer; z-index: 90;
  transition: transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s, opacity .2s;
}
#fab:active { transform: scale(.9); box-shadow: 0 4px 15px rgba(108,99,255,.3); }
#fab.hidden { opacity: 0; pointer-events: none; transform: scale(0); }
@media (max-width: 430px) { #fab { right: 16px; } }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
  padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.04);
}
.card-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.card-hd-title { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing:.3px; }
.card-hd-val { font-size: 15px; font-weight: 900; }
.balance-card {
  background: linear-gradient(135deg, #6c63ff 0%, #8b5cf6 60%, #06b6d4 100%);
  border-radius: 24px; padding: 22px 20px; margin-bottom: 14px; color: #fff;
  position: relative; overflow: hidden;
  box-shadow: 0 12px 35px rgba(108,99,255,.35);
}
.balance-card::before {
  content: ''; position: absolute; top: -30px; right: -30px;
  width: 120px; height: 120px;
  background: radial-gradient(circle, rgba(255,255,255,.15) 0%, transparent 70%); pointer-events: none;
}
.balance-card::after {
  content: ''; position: absolute; bottom: -20px; left: -20px;
  width: 90px; height: 90px;
  background: radial-gradient(circle, rgba(255,255,255,.1) 0%, transparent 70%); pointer-events: none;
}
.bal-label { font-size: 12px; font-weight: 700; opacity: .85; margin-bottom: 4px; }
.bal-amount { font-size: 40px; font-weight: 900; letter-spacing: -1px; line-height: 1; margin-bottom: 4px; }
.bal-amount small { font-size: 17px; font-weight: 700; opacity: .8; }
.bal-meta { font-size: 11.5px; opacity: .8; margin-top: 8px; }
.bal-edit-btn {
  position: absolute; top: 14px; left: 14px;
  background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.3);
  border-radius: 10px; color: #fff; font-size: 12px; font-weight: 700;
  padding: 5px 10px; cursor: pointer; backdrop-filter: blur(8px); font-family: inherit;
}
.bal-edit-btn:active { background: rgba(255,255,255,.35); transform: scale(.95); }
.stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.stat-box {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm);
  padding: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.04);
}
.stat-box .sb-label { font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
.stat-box .sb-val { font-size: 18px; font-weight: 900; color: var(--ink); }
.stat-box .sb-val small { font-size: 11px; font-weight: 600; color: var(--muted); }
.fc-banner {
  background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
  border-radius: var(--r); padding: 14px 16px; margin-bottom: 14px;
  display: flex; align-items: center; justify-content: space-between; cursor: pointer;
  box-shadow: 0 4px 16px rgba(99,91,255,.2); transition: transform .15s;
}
.fc-banner:active { transform: scale(.98); }
.fc-banner .fc-left { display: flex; align-items: center; gap: 10px; }
.fc-banner .fc-icon { font-size: 28px; }
.fc-banner .fc-label { font-size: 10.5px; font-weight: 700; color: #a5b4fc; margin-bottom: 2px; }
.fc-banner .fc-amt { font-size: 22px; font-weight: 900; color: #fff; }
.fc-banner .fc-amt small { font-size: 12px; }
.fc-arrow { background: rgba(255,255,255,.15); color: #fff; font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 20px; white-space: nowrap; }
.list-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--border); }
.list-row:last-child { border-bottom: none; }
.list-row .lr-info { flex: 1; min-width: 0; }
.list-row .lr-name { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-row .lr-meta { font-size: 11px; color: var(--muted); margin-top: 1px; }
.list-row .lr-amt { font-size: 14px; font-weight: 900; white-space: nowrap; }
.list-row .lr-amt small { font-size: 11px; font-weight: 600; }
.lr-actions { display: flex; gap: 4px; }
.lr-btn {
  width: 30px; height: 30px; border-radius: 8px; border: none;
  background: var(--surface2); font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all .13s; color: var(--muted);
}
.lr-btn:active { transform: scale(.88); }
.lr-btn.del:active { background: #fee2e2; color: var(--neg); }
.lr-btn.edit:active { background: #ede9fe; color: var(--acc); }
.total-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0 2px; border-top: 2px solid var(--border);
  margin-top: 4px; font-weight: 900; font-size: 14.5px;
}
.field { margin-bottom: 10px; }
.field label { font-size: 11px; font-weight: 700; color: var(--muted); display: block; margin-bottom: 4px; }
.field input {
  width: 100%; font: inherit; font-size: 14px; padding: 11px 14px;
  border: 1.5px solid var(--border); border-radius: var(--r-sm);
  background: var(--surface2); color: var(--ink); -webkit-appearance: none;
  transition: border-color .15s, box-shadow .15s;
}
.field input:focus {
  outline: none; border-color: var(--acc);
  box-shadow: 0 0 0 3px rgba(108,99,255,.15); background: var(--surface);
}
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.form-grid .span2 { grid-column: 1/-1; }
.btn {
  font: inherit; font-size: 14px; font-weight: 800; padding: 12px 20px;
  border-radius: var(--r-sm); border: none; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: all .15s; -webkit-appearance: none; width: 100%;
}
.btn-primary { background: linear-gradient(135deg, var(--acc), var(--acc2)); color: #fff; box-shadow: 0 4px 15px rgba(108,99,255,.3); }
.btn-primary:active { opacity: .88; transform: scale(.97); }
.btn-ghost { background: var(--surface2); color: var(--ink); border: 1.5px solid var(--border); }
.btn-ghost:active { background: var(--border); }
.btn-sm { padding: 8px 14px; font-size: 12.5px; width: auto; border-radius: 10px; }
.btn-row { display: flex; gap: 8px; margin-top: 12px; }
.btn-row .btn { flex: 1; }
.collapse-toggle {
  background: none; border: none; width: 100%; display: flex; align-items: center;
  justify-content: space-between; padding: 6px 0; cursor: pointer; color: var(--muted);
  font: inherit; font-size: 12px; font-weight: 700;
}
.collapse-toggle .ct-arrow { transition: transform .2s; }
.collapse-toggle.open .ct-arrow { transform: rotate(180deg); }
.collapse-body { overflow: hidden; transition: max-height .3s ease; }
.collapse-body.closed { max-height: 0 !important; }
.accent-bar-pos { border-right: 4px solid var(--pos); }
.accent-bar-neg { border-right: 4px solid var(--neg); }
.accent-bar-gold { border-right: 4px solid var(--gold); }
.fc-hero {
  background: linear-gradient(135deg, #1e1b4b 0%, #4338ca 60%, #0284c7 100%);
  border-radius: 24px; padding: 22px 20px; color: #fff; margin-bottom: 14px;
  box-shadow: 0 10px 30px rgba(67,56,202,.3); position: relative; overflow: hidden;
}
.fc-hero::before {
  content: ''; position: absolute; top: -30px; right: -30px; width: 120px; height: 120px;
  background: radial-gradient(circle, rgba(255,255,255,.12) 0%, transparent 70%);
}
.fc-chip {
  display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800;
  padding: 5px 12px; border-radius: 20px; background: rgba(255,255,255,.18); margin-top: 8px;
}
.gold-hero {
  background: linear-gradient(135deg, #92400e 0%, #d97706 60%, #fbbf24 100%);
  border-radius: 24px; padding: 22px 20px; color: #fff; margin-bottom: 14px;
  box-shadow: 0 10px 30px rgba(217,119,6,.3);
}
.log-item {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm);
  padding: 12px 14px; margin-bottom: 8px;
}
.log-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.log-badge { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 20px; }
.badge-add { background: #d1fae5; color: #059669; }
.badge-edit { background: #fef3c7; color: #d97706; }
.badge-del { background: #fee2e2; color: var(--neg); }
[data-theme=dark] .badge-add { background: #064e3b; color: #34d399; }
[data-theme=dark] .badge-edit { background: #451a03; color: #fbbf24; }
[data-theme=dark] .badge-del { background: #450a0a; color: #f87171; }
.log-time { font-size: 10.5px; color: var(--muted); }
.log-name { font-size: 13px; font-weight: 700; margin-bottom: 3px; }
.log-desc { font-size: 11.5px; color: var(--muted); }
.log-vals { font-size: 12px; color: var(--muted); margin-top: 2px; }
.log-footer { display: flex; justify-content: flex-end; margin-top: 8px; }
.del-log-btn {
  background: none; border: 1px solid var(--border); border-radius: 8px;
  font: inherit; font-size: 11px; color: var(--neg); padding: 4px 10px; cursor: pointer;
}
.del-log-btn:active { background: #fee2e2; }
#toast {
  position: fixed; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 12px);
  left: 50%; transform: translateX(-50%) translateY(10px);
  background: rgba(15,15,30,.9); backdrop-filter: blur(10px);
  color: #fff; padding: 9px 20px; border-radius: 24px;
  font-size: 13px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.25);
  opacity: 0; pointer-events: none; transition: all .22s; z-index: 9000;
  max-width: 90vw; text-align: center; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.5); backdrop-filter: blur(6px);
  display: flex; align-items: flex-end; justify-content: center; z-index: 8000;
}
.sheet {
  background: var(--surface); border-radius: 28px 28px 0 0;
  padding: 0 20px 28px; width: 100%; max-width: 430px;
  max-height: 90dvh; overflow-y: auto;
  box-shadow: 0 -10px 50px rgba(0,0,0,.25);
  animation: su .25s cubic-bezier(.16,1,.3,1);
}
.sheet::before {
  content: ''; display: block; width: 40px; height: 4px; border-radius: 4px;
  background: var(--border); margin: 12px auto 18px;
}
@keyframes su { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.sheet-head h2 { font-size: 17px; font-weight: 900; }
.sheet-close {
  width: 32px; height: 32px; border-radius: 50%; background: var(--surface2);
  border: 1px solid var(--border); font-size: 16px; color: var(--muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.sheet-close:active { background: var(--border); }
.hint { font-size: 12px; color: var(--muted); line-height: 1.55; padding: 4px 0; }
.info-box {
  background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r-sm);
  padding: 12px 14px; margin-bottom: 14px; font-size: 12.5px; line-height: 1.6;
}
.info-box b { color: var(--acc); }
.pos { color: var(--pos); } .neg { color: var(--neg); } .acc { color: var(--acc); }
.empty-state { text-align: center; padding: 30px 10px; color: var(--muted); }
.empty-state .ei { font-size: 42px; margin-bottom: 8px; }
.empty-state p { font-size: 13px; }
.bk-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
.bk-row:last-child { border-bottom: none; }
.bk-row.total { border-top: 2px solid var(--ink); border-bottom: none; margin-top: 4px; padding-top: 10px; font-weight: 900; font-size: 14px; }
.sheet-steps { background: var(--surface2); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; font-size: 12.5px; line-height: 1.8; }
.sheet-steps b { color: var(--acc); }
.sheet-steps ol { padding-inline-start: 16px; }
.connect-banner {
  background: linear-gradient(135deg, #ede9fe 0%, #dbeafe 100%);
  border: 1.5px dashed #a5b4fc; border-radius: var(--r); padding: 14px 16px;
  margin-bottom: 14px; cursor: pointer; transition: all .15s;
}
[data-theme=dark] .connect-banner { background: linear-gradient(135deg, #1e1b4b 0%, #1e3a5f 100%); border-color: #4338ca; }
.connect-banner:active { transform: scale(.98); }
.cb-title { font-size: 14px; font-weight: 800; color: var(--acc); margin-bottom: 2px; }
.cb-sub { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div id="shell">
  <header id="hdr"></header>
  <main id="app"></main>
  <nav id="nav"></nav>
</div>
<button id="fab" onclick="openAddSheet()">＋</button>
<div id="toast"></div>
<div id="modal-root"></div>
<script>

function ic(name, size, cls) {

  var c = cls ? ' ' + cls : '';
  var svgs = {

    forecast: '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
    exp: '<rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/>',
    badr: '<rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/>',

function fmtDT(d){

}

function postSheet(payload,cb){
  if(!sheetUrl){if(cb)cb({success:false});return;}
  syncSt.status='syncing';updateSync();
  fetch(sheetUrl,{method:'POST',mode:'cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.success){syncSt.status='synced';syncSt.last=timeNow();localStorage.setItem(SYNC_KEY,syncSt.last);updateSync();if(cb)cb(d);}
      else{throw new Error(d.error||'خطأ');}
    })
    .catch(function(e){syncSt.status='error';updateSync();toast('محفوظ محلياً — '+e.message);if(cb)cb({success:false});});
}
function fetchSheet(manual){
  if(!sheetUrl)return;
  syncSt.status='syncing';updateSync();
  var url=sheetUrl+(sheetUrl.indexOf('?')===-1?'?action=get':'&action=get')+'&_t='+Date.now();
  fetch(url)
    .then(function(r){return r.json();})
    .then(function(resp){
      if(resp.success&&resp.data){
        var d=resp.data;
        var empty=(!d.bank&&!d.fund&&(!d.exp||d.exp.length===0));
        if(empty&&(S.bank>0||S.fund>0||(S.exp&&S.exp.length>0))){
          syncSt.status='synced';updateSync();
          if(confirm('الشيت فارغ — هل ترفع بياناتك الحالية؟'))uploadAll();return;
        }
        if(typeof d.bank==='number')S.bank=d.bank;
        if(typeof d.fund==='number')S.fund=d.fund;
        if(typeof d.sister==='number')S.sister=d.sister;
        if(d.g21)S.g21=d.g21;if(d.g24)S.g24=d.g24;
        ['exp','inc','badrE','badrI','expected','expectedExp','logs'].forEach(function(k){if(Array.isArray(d[k]))S[k]=d[k];});
        save();syncSt.status='synced';syncSt.last=timeNow();localStorage.setItem(SYNC_KEY,syncSt.last);
        render();if(manual)toast('تم التحديث');
      }else{throw new Error(resp.error||'خطأ');}
    })
    .catch(function(e){syncSt.status='error';updateSync();if(manual)toast('تعذر الاتصال: '+e.message);});
}

function getShareUrl(){
  var base=window.location.origin+window.location.pathname;

function copyShareUrl(){

function saveSheetCfg(){
  var url=(document.getElementById('cfg_url').value||'').trim();

  sheetUrl=url;localStorage.setItem(SHEET_KEY,url);
  closeModal();toast('جاري التحقق...');fetchSheet(true);
}
function disconnectSheet(){
  if(!confirm('قطع الربط؟'))return;
  sheetUrl='';localStorage.removeItem(SHEET_KEY);syncSt.status='idle';
  closeModal();render();toast('تم قطع الربط');
}

function updateSync(){
  var el=document.getElementById('sync-pill');if(!el)return;
  if(!sheetUrl){el.className='sync-pill';el.innerHTML='<span class="sync-dot"></span>غير مربوط';return;}
  if(syncSt.status==='syncing'){el.className='sync-pill going';el.innerHTML='<span class="sync-dot pulse"></span>مزامنة...';}
  else if(syncSt.status==='error'){el.className='sync-pill err';el.innerHTML='<span class="sync-dot"></span>خطأ';}
  else{el.className='sync-pill ok';el.innerHTML='<span class="sync-dot"></span>'+(syncSt.last||'متصل');}
}
function deleteLog(id){
  if(!confirm('حذف؟'))return;
  S.logs=(S.logs||[]).filter(function(x){return String(x.id)!==String(id);});
  save();render();toast('تم');
  if(sheetUrl)postSheet({action:'deleteLog',id:id},function(r){if(r.success)toast('تم');});
}
function clearLogs(){
  if(!confirm('مسح كل السجل؟'))return;
  S.logs=[];save();render();toast('تم');

      '<div class="card">'+
        '<div class="card-hd"><span class="card-hd-title">ملخص ثروة البيت</span></div>'+
        '<div class="bk-row"><span>'+ic('gold',15)+' الدهب</span><b>'+m(c.gold)+' ج</b></div>'+
        '<div class="bk-row"><span>'+ic('cash',15)+' سيولة البيت</span><b>'+m(c.cash)+' ج</b></div>'+
        '<div class="bk-row total"><span>إجمالي البيت</span><b>'+m(c.gold+c.cash)+' ج</b></div>'+
      '</div>'+
      '<p class="hint" style="text-align:center">تعديل السعر أو الوزن يُزامن تلقائياً</p>';
  }
  if(tab==='logs'){
    var logs=S.logs||[];
    var logHtml=logs.length?
      logs.map(function(l){
        var bc=l.type&&l.type.indexOf('حذف')!==-1?'badge-del':(l.type&&l.type.indexOf('إضافة')!==-1?'badge-add':'badge-edit');
        return '<div class="log-item">'+
          '<div class="log-top">'+
            '<span class="log-badge '+bc+'">'+esc(l.type)+'</span>'+
            '<span class="log-time">'+esc(l.dt)+'</span>'+
          '</div>'+
          '<div class="log-name">'+esc(l.n||l.desc)+'</div>'+
          (l.desc?'<div class="log-desc">'+esc(l.desc)+'</div>':'')+
          (l.oldV!==undefined&&l.oldV!==''&&l.newV!==undefined&&l.newV!==''?'<div class="log-vals"><s>'+m(l.oldV)+' ج</s> → <b class="pos">'+m(l.newV)+' ج</b></div>':'')+
          '<div class="log-footer"><button class="del-log-btn" data-lid="'+esc(l.id)+'" onclick="deleteLog(this.getAttribute(\'data-lid\'))">'+ic('del',13)+' حذف</button></div>'+
        '</div>';
      }).join(''):
      '<div class="empty-state"><div class="ei">'+ic('empty',32)+'</div><p>لا توجد تعديلات بعد.</p></div>';
    return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'+
        '<div><b style="font-size:16px">'+ic('logs',16)+' السجل</b><div class="hint">'+logs.length+' حركة</div></div>'+
        (logs.length?'<button class="btn btn-ghost btn-sm" style="color:var(--neg);border-color:var(--neg)" onclick="clearLogs()">'+ic('broom',14)+' مسح</button>':'')+
      '</div>'+logHtml;
  }
  return '';
}
function render(){
  document.getElementById('app').innerHTML=view();
  updateSync();
  var tabs=[['home','الرئيسية'],['forecast','التوقعات'],['exp','المصاريف'],['badr','بدر'],['gold','الدهب'],['logs','السجل']];
  document.getElementById('nav').innerHTML=tabs.map(function(t){
    return '<button class="nav-btn'+(tab===t[0]?' on':'')+'" onclick="go(\''+t[0]+'\')">'+
      '<span class="ni">'+ic(t[0],22)+'</span><span class="nl">'+t[1]+'</span></button>';
  }).join('');
}
render();
if(sheetUrl)fetchSheet(false);
window.addEventListener('focus',function(){if(sheetUrl&&syncSt.status!=='syncing')fetchSheet(false);});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&sheetUrl&&syncSt.status!=='syncing')fetchSheet(false);});
setInterval(function(){if(sheetUrl&&syncSt.status!=='syncing')fetchSheet(false);},30000);
</script>
</body>
